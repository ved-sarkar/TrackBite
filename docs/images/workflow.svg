<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc"><title id="title">TrackBite: weigh, identify, log</title><desc id="desc">Concept workflow diagram, not an app screenshot. Simulated plate tare 100 grams, gross 140 grams, net food 40 grams. Camera matching remains planned; the prototype uses a local mock.</desc><rect width="1280" height="440" rx="20" fill="#f4f0e8"/><text x="48" y="54" font-family="Arial,sans-serif" font-size="13" letter-spacing="3" fill="#a85d38">TRACKBITE / FROM PORTION TO CONTEXT</text><text x="48" y="107" font-family="Georgia,serif" font-size="40" fill="#182b40">A measured approach to food.</text><g font-family="Arial,sans-serif"><rect x="48" y="147" width="364" height="218" rx="14" fill="#182b40"/><text x="72" y="181" font-size="12" letter-spacing="2" fill="#ecc3a3">01 / WEIGH</text><text x="72" y="244" font-size="39" fill="#fffdf8">140 − 100 = 40 g</text><text x="72" y="282" font-size="16" fill="#d5dce3">Gross − plate tare = net food</text><text x="72" y="333" font-size="13" fill="#ecc3a3">Implemented: simulated scale states</text><rect x="434" y="147" width="364" height="218" rx="14" fill="#fffdf8" stroke="#ded8ce"/><text x="458" y="181" font-size="12" letter-spacing="2" fill="#a85d38">02 / IDENTIFY</text><text x="458" y="239" font-family="Georgia,serif" font-size="32" fill="#182b40">Match. Review. Confirm.</text><text x="458" y="282" font-size="16" fill="#69717b">Food identity + nutrition source</text><text x="458" y="333" font-size="13" fill="#a85d38">Mock today · camera integration planned</text><rect x="820" y="147" width="412" height="218" rx="14" fill="#fffdf8" stroke="#ded8ce"/><text x="844" y="181" font-size="12" letter-spacing="2" fill="#a85d38">03 / LOG</text><text x="844" y="239" font-family="Georgia,serif" font-size="32" fill="#182b40">Keep the context.</text><text x="844" y="282" font-size="16" fill="#69717b">Net grams / 100 × per-100 g values</text><text x="844" y="333" font-size="13" fill="#a85d38">Demo session log + saved manual meals</text><text x="48" y="405" font-size="12" fill="#69717b">CONCEPT DIAGRAM · Demo values are simulated. No live sensor or camera measurement is shown.</text></g></svg>
